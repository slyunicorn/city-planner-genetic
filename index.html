<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI City Planner</title>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="viewport">

    <!-- Everything inside this moves/zooms together -->
    <div id="world">

        <canvas id="map"></canvas>

        <svg id="viz">
            <defs>
                <clipPath id="cityClip">
                    <path id="cityClipPath"></path>
                </clipPath>
            </defs>

            <g id="voronoiLayer"></g>
            <g id="boundaryLayer"></g>
            <g id="pointLayer"></g>
            <g id="facilityVoronoiLayer"></g>
            <g id="facilityPointLayer"></g>
            <g id="vertexLayer"></g>
        </svg>

    </div>

</div>


<div id="controls">

    <div id="controls-header">
        <span>City Planner</span>
        <span id="drag-hint">⠿</span>
    </div>


    <!-- =========================================================
         TABS
         ========================================================= -->

    <div id="tabBar" role="tablist">
        <button class="tab active" data-tab="terrain" role="tab">Terrain</button>
        <button class="tab" data-tab="blocks" role="tab">Blocks</button>
        <button class="tab" data-tab="facilities" role="tab">Facilities</button>
    </div>


    <div id="tabBody">

        <!-- ---------------------------------------------------
             TERRAIN
             --------------------------------------------------- -->

        <section class="tab-panel active" data-panel="terrain">

            <div class="control-section">
                <div class="field-row">
                    <label class="field">
                        <span>Latitude</span>
                        <input id="latInput" type="number" step="0.0001" value="12.9229">
                    </label>

                    <label class="field">
                        <span>Longitude</span>
                        <input id="lonInput" type="number" step="0.0001" value="80.1275">
                    </label>
                </div>

                <div class="field-row">
                    <label class="field">
                        <span>Radius (m)</span>
                        <input id="distInput" type="number" step="100" min="100" value="3000">
                    </label>

                    <label class="field">
                        <span>Sea level (m)</span>
                        <input id="seaLevelInput" type="number" step="1" value="0">
                    </label>
                </div>

                <div class="field-row">
                    <label class="field">
                        <span>Grid</span>
                        <select id="sizeSelect">
                            <option value="256">256</option>
                            <option value="512" selected>512</option>
                            <option value="1024">1024</option>
                        </select>
                    </label>
                </div>
            </div>

            <button id="loadTerrainBtn">
                Load Terrain
            </button>

            <div id="scaleNote">Loading terrain...</div>

        </section>


        <!-- ---------------------------------------------------
             BLOCKS
             --------------------------------------------------- -->

        <section class="tab-panel" data-panel="blocks">

            <div class="control-section">
                <label>
                    <span>R (spacing)</span>
                    <span id="rValue">18</span>
                </label>

                <input id="rSlider" type="range" min="3" max="100" value="18">
            </div>

            <div class="control-section">
                <label>
                    <span>K (attempts)</span>
                    <span id="kValue">30</span>
                </label>

                <input id="kSlider" type="range" min="1" max="100" value="30">
            </div>

            <button id="generateBtn">
                Generate Poisson Points
            </button>

            <button id="closeBtn">
                Close City Boundary
            </button>

            <div class="control-section">
                <label>
                    <span>Relax Iterations</span>
                    <span id="relaxIterationsValue">50</span>
                </label>

                <input id="relaxIterationsSlider" type="range" min="1" max="300" value="50">
            </div>

            <button id="relaxBtn" disabled>
                Relax Points
            </button>

        </section>


        <!-- ---------------------------------------------------
             FACILITIES
             --------------------------------------------------- -->

        <section class="tab-panel" data-panel="facilities">

            <div class="control-section">
                <label>
                    <span>Facility Spacing</span>
                    <span id="facilityRValue">90</span>
                </label>

                <input id="facilityRSlider" type="range" min="20" max="300" value="90">
            </div>

            <button id="placeFacilitiesBtn" disabled>
                Place Facilities
            </button>

            <div class="control-section">
                <label>
                    <span>Epochs</span>
                    <span id="epochsValue">100</span>
                </label>

                <input id="epochsSlider" type="range" min="1" max="500" value="100">
            </div>

            <button id="optimizeBtn" disabled>
                Optimize City Plan
            </button>

            <div id="metric">
                <div id="metricLabel">Score</div>
                <div id="metricScore">--</div>
                <div id="metricDetail">Place facilities to measure.</div>
            </div>

        </section>

    </div>


    <!-- =========================================================
         ALWAYS VISIBLE — layer toggles, reset, status
         ========================================================= -->

    <div id="layerBar">

        <div class="layer-title">Layers</div>

        <label class="checkbox-row">
            <input id="sobelToggle" type="checkbox">
            Sobel Slope Map
        </label>

        <label class="checkbox-row">
            <input id="voronoiToggle" type="checkbox">
            Voronoi Diagram
        </label>

        <label class="checkbox-row">
            <input id="facilityToggle" type="checkbox" checked>
            Facility Layer
        </label>

        <button id="resetBtn" class="ghost">
            Reset City
        </button>

        <div id="status">
            Loading terrain...
        </div>

    </div>

</div>


<div id="logPanel">

    <div id="logPanel-header">
        Log
    </div>

    <div id="logList"></div>

</div>

<script src="app.js"></script>

</body>
</html>
