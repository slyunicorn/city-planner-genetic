<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI City Planner</title>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="viewport">

    <!-- Everything in the map lives inside this SVG -->
    <svg id="viz">
        <defs>
            <clipPath id="cityClip">
                <path id="cityClipPath"></path>
            </clipPath>
        </defs>

        <!-- Altitude map -->
        <image id="map"
               href="altitude-map.png"
               preserveAspectRatio="none">
        </image>

        <!-- Voronoi -->
        <g id="voronoiLayer"></g>

        <!-- City boundary -->
        <g id="boundaryLayer"></g>

        <!-- Points -->
        <g id="pointLayer"></g>

        <!-- Boundary editing vertices -->
        <g id="vertexLayer"></g>
    </svg>

</div>


<!-- Floating controls -->
<div id="controls">

    <div id="controls-header">
        <span>City Planner</span>
        <span id="drag-hint">⠿</span>
    </div>

    <div class="control-section">

        <label>
            R:
            <span id="rValue">18</span>
        </label>

        <input
            id="rSlider"
            type="range"
            min="3"
            max="100"
            value="18"
        >

    </div>


    <div class="control-section">

        <label>
            K:
            <span id="kValue">30</span>
        </label>

        <input
            id="kSlider"
            type="range"
            min="1"
            max="100"
            value="30"
        >

    </div>


    <button id="generateBtn">
        Generate Poisson Points
    </button>

    <button id="closeBtn">
        Close City
    </button>

    <button id="resetBtn">
        Reset
    </button>


    <label class="checkbox-row">
        <input
            id="voronoiToggle"
            type="checkbox"
        >
        Show Voronoi Diagram
    </label>


    <div id="status">
        Click points around the map to create the city boundary.
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
