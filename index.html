<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI City Planner</title>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="viewport">

    <!-- Everything inside this moves/zooms together -->
    <div id="world">

        <img id="map" src="./altitude-map.png" alt="Altitude map">

        <svg id="viz">
            <defs>
                <clipPath id="cityClip">
                    <path id="cityClipPath"></path>
                </clipPath>
            </defs>

            <g id="voronoiLayer"></g>
            <g id="boundaryLayer"></g>
            <g id="pointLayer"></g>
            <g id="vertexLayer"></g>
        </svg>

    </div>

</div>


<div id="controls">

    <div id="controls-header">
        <span>City Planner</span>
        <span id="drag-hint">⠿</span>
    </div>

    <div class="control-section">
        <label>
            <span>R</span>
            <span id="rValue">18</span>
        </label>

        <input
            id="rSlider"
            type="range"
            min="3"
            max="100"
            value="18"
        >
    </div>

    <div class="control-section">
        <label>
            <span>K</span>
            <span id="kValue">30</span>
        </label>

        <input
            id="kSlider"
            type="range"
            min="1"
            max="100"
            value="30"
        >
    </div>

    <button id="generateBtn">
        Generate Poisson Points
    </button>

    <button id="closeBtn">
        Close City
    </button>

    <button id="resetBtn">
        Reset
    </button>

    <div class="control-section">
        <label>
            <span>Relax Iterations</span>
            <span id="relaxIterationsValue">50</span>
        </label>

        <input
            id="relaxIterationsSlider"
            type="range"
            min="1"
            max="300"
            value="50"
        >
    </div>

    <button id="relaxBtn" disabled>
        Relax Points
    </button>

    <label class="checkbox-row">
        <input id="voronoiToggle" type="checkbox">
        Show Voronoi Diagram
    </label>

    <div id="status">
        Loading map...
    </div>

</div>


<div id="logPanel">

    <div id="logPanel-header">
        Log
    </div>

    <div id="logList"></div>

</div>

<script src="app.js"></script>

</body>
</html>
